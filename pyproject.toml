[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "album-assetizer"
version = "0.1.0"
description = "Turn personal albums into reusable semantic data assets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "wangshuo" }
]
dependencies = [
    "openai>=2.38.0",
    "Pillow>=11.1.0",
    "pillow-heif>=1.3.0",
    "rawpy>=0.27.0",
    "tqdm>=4.67.0",
]
keywords = ["album", "photo", "vision", "metadata", "semantic-search", "multimodal", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/wangshuo/album-assetizer"
Repository = "https://github.com/wangshuo/album-assetizer"
Issues = "https://github.com/wangshuo/album-assetizer/issues"

[project.scripts]
album-assetizer = "album_assetizer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
